[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keychat-bots"
version = "0.1.0"
description = "Official Python SDK for Key Chat bots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pdoc>=15"]

[tool.pytest.ini_options]
pythonpath = ["src"]
